name: Stage on Maven Central

on:
  workflow_dispatch:
    inputs:
      confirm_api_5_1_contract_ready:
        description: Confirm the RWR 5.1 API contract is final
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    if: ${{ inputs.confirm_api_5_1_contract_ready }}
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Verify release version
        shell: bash
        run: |
          version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          test "$version" = "5.1.1"
          test "${{ github.ref }}" = "refs/heads/main"
      - name: Stage signed Central bundle
        run: mvn --batch-mode --no-transfer-progress -Pcentral-release -Drwr.api.contract.ready=true deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
