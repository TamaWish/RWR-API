name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      confirm_runtime_5_1_ready:
        description: Confirm the matching RWR runtime API integration is released
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    if: ${{ inputs.confirm_runtime_5_1_ready && vars.RWR_RUNTIME_API_READY == 'true' }}
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Verify release version
        shell: bash
        run: |
          version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          test "$version" = "5.1.0"
          test "${{ github.ref }}" = "refs/heads/main"
      - name: Publish signed Central bundle
        run: mvn --batch-mode --no-transfer-progress -Pcentral-release -Drwr.runtime.api.ready=true deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
